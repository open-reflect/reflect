<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="reflect-arch-title reflect-arch-desc">
  <title id="reflect-arch-title">How reflect works</title>
  <desc id="reflect-arch-desc">Data flow of reflect: every turn a Stop hook ingests the Claude Code transcript into a local SQLite database that feeds the stats commands; once a week twelve SQL miners read that database, two qualitative proposals pass a three-draft three-vote judge run on a headless claude or codex CLI, surviving drafts are appended to learned-rules.md with a rollback copy, and CLAUDE.md imports that file so the next session starts with the rules.</desc>
